name: healthlog-visit-test
services:
  db:
    image: postgres:18.6-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: healthlog_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: healthlog_test
    volumes:
      - test-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthlog_test -d healthlog_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  app:
    image: ${HEALTHLOG_TEST_IMAGE:-ghcr.io/mbombeck/healthlog@sha256:2f88b2c290431ae4472f2d3c8f0b70109b55c0dce1cfb3e147d55927bd7def5f}
    pull_policy: never
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://healthlog_test:${POSTGRES_PASSWORD}@db:5432/healthlog_test?schema=public&connection_limit=10&pool_timeout=20
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      API_TOKEN_HMAC_KEY: ${API_TOKEN_HMAC_KEY:?required}
      APP_URL: http://localhost:3301
      NEXT_PUBLIC_APP_URL: http://localhost:3301
      SESSION_COOKIE_SECURE: "false"
      HEALTHLOG_PROCESS_TYPE: all
      DB_BACKUP_DIR: /var/lib/healthlog/backups
      UPDATE_CHECK_DISABLED: "1"
    ports:
      - "127.0.0.1:3301:3000"
    volumes:
      - test-backups:/var/lib/healthlog/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10m
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  test-postgres-data:
  test-backups:
